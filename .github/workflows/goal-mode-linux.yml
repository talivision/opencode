name: goal-mode linux binaries

on:
  workflow_dispatch:
  push:
    branches:
      - goal-mode

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            output: opencode-linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            output: opencode-linux-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build native Linux binary
        env:
          OPENCODE_VERSION: 0.0.0-goal-mode-${{ github.sha }}
        run: ./packages/opencode/script/build.ts --single --skip-install --skip-embed-web-ui

      - name: Verify and package binary
        env:
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          test -x "packages/opencode/dist/${OUTPUT}/bin/opencode"
          "packages/opencode/dist/${OUTPUT}/bin/opencode" --version
          mkdir -p artifacts
          tar -C packages/opencode/dist -czf "artifacts/${OUTPUT}.tar.gz" "${OUTPUT}"
          sha256sum "artifacts/${OUTPUT}.tar.gz" > "artifacts/${OUTPUT}.tar.gz.sha256"

      - name: Upload Linux binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.output }}
          path: |
            artifacts/${{ matrix.output }}.tar.gz
            artifacts/${{ matrix.output }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
