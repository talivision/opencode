name: harness

# The tmux harnesses are the only end-to-end coverage for goal mode and
# subagents: they drive a real compiled binary through the TUI against an
# isolated fake provider and assert against the session database. Unit tests
# exercise the services; only this catches wiring that is correct in isolation
# and wrong in the built product.
#
# drive.sh's exit code is unreliable (it varies by harness), so this job asserts
# on its grep-able PASS/FAIL lines rather than on the exit code, and fails when
# an expected PASS is missing as well as when a FAIL appears — a scenario that
# silently stops emitting assertions must not read as success.

on:
  push:
    branches:
      - dev
      - goal-mode
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly soak: the long-running pacing/stability scenarios are too slow
    # for the per-push job and run here instead.
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  soak:
    name: tui soak harness
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux sqlite3

      - name: Build binary
        run: OPENCODE_VERSION=dev ./packages/opencode/script/build.ts --single --skip-install --skip-embed-web-ui

      - name: Locate binary
        id: bin
        run: |
          path="$(ls packages/opencode/dist/*/bin/opencode | head -1)"
          test -x "$path" || { echo "no executable binary under packages/opencode/dist"; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Drive soak scenarios
        env:
          BIN: ${{ github.workspace }}/${{ steps.bin.outputs.path }}
        run: |
          set -uo pipefail
          fail=0

          run_scenario() {
            local harness="$1" scenario="$2" watch="$3" port="$4" expected="$5"
            local log="/tmp/harness-${harness}-${scenario}.log"
            echo "::group::${harness} ${scenario}"
            PORT="$port" \
            SOCK="/tmp/harness-${harness}-${scenario}.sock" \
            WORK="/tmp/harness-${harness}-${scenario}" \
              bash "script/${harness}/drive.sh" "$scenario" "$watch" 2>&1 | tee "$log" || true
            echo "::endgroup::"

            if grep -qE '^(FAIL|not ok)' "$log"; then
              echo "::error::${harness}/${scenario} reported a failing assertion"
              grep -E '^(FAIL|not ok)' "$log"
              fail=1
            fi
            local seen
            seen="$(grep -cE '^(PASS|ok)' "$log" || true)"
            if [ "$seen" -lt "$expected" ]; then
              echo "::error::${harness}/${scenario} emitted ${seen} passing assertions, expected at least ${expected} — the scenario stopped short"
              fail=1
            fi
          }

          run_scenario goal-harness soak 540 4910 6
          run_scenario subagent-harness soak 420 4911 5

          exit "$fail"

      - name: Upload soak artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-logs
          path: |
            /tmp/harness-*.log
            /tmp/harness-*/snaps
            /tmp/harness-*/provider.log
            /tmp/harness-*/tui.log
          if-no-files-found: ignore
          retention-days: 7

  drive:
    name: tui harness
    # Stock runner: Blacksmith labels queue forever on forks without the
    # Blacksmith app installed — the job shows "pending" for days and every
    # push's concurrency group cancels the last one, so the harness never ran.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux sqlite3

      - name: Build binary
        run: OPENCODE_VERSION=dev ./packages/opencode/script/build.ts --single --skip-install --skip-embed-web-ui

      - name: Locate binary
        id: bin
        run: |
          # --single builds for the host platform, so the dist directory name
          # differs from the darwin default baked into drive.sh.
          path="$(ls packages/opencode/dist/*/bin/opencode | head -1)"
          test -x "$path" || { echo "no executable binary under packages/opencode/dist"; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Drive scenarios
        env:
          BIN: ${{ github.workspace }}/${{ steps.bin.outputs.path }}
        run: |
          set -uo pipefail
          fail=0

          run_scenario() {
            local harness="$1" scenario="$2" watch="$3" port="$4" expected="$5"
            local log="/tmp/harness-${harness}-${scenario}.log"
            echo "::group::${harness} ${scenario}"
            PORT="$port" \
            SOCK="/tmp/harness-${harness}-${scenario}.sock" \
            WORK="/tmp/harness-${harness}-${scenario}" \
              # GitHub invokes the step with `bash -e`, and `set -uo pipefail`
              # above does NOT clear -e. drive.sh does not always exit 0 (the
              # subagent harness exits 1 on failure, and the goal harness runs
              # under `set -e` with an asserting node script last), so without
              # `|| true` the first failing scenario aborts the step mid-run and
              # none of the reporting below — the FAIL grep, the assertion
              # count, the artifact upload — ever executes.
              bash "script/${harness}/drive.sh" "$scenario" "$watch" 2>&1 | tee "$log" || true
            echo "::endgroup::"

            if grep -qE '^(FAIL|not ok)' "$log"; then
              echo "::error::${harness}/${scenario} reported a failing assertion"
              grep -E '^(FAIL|not ok)' "$log"
              fail=1
            fi
            local seen
            seen="$(grep -cE '^(PASS|ok)' "$log" || true)"
            if [ "$seen" -lt "$expected" ]; then
              echo "::error::${harness}/${scenario} emitted ${seen} passing assertions, expected at least ${expected} — the scenario stopped short"
              fail=1
            fi
          }

          # Only self-asserting scenarios run here. goal-harness scenarios other
          # than `retrieval` report by printing durable state for a human to
          # read rather than emitting assertions, so they would pass vacuously.
          # Ports and sockets are distinct so a leaked process from one
          # scenario cannot poison the next.
          run_scenario goal-harness retrieval 70 4901 12
          run_scenario goal-harness unclaimed 40 4904 6
          run_scenario goal-harness ux_goal_window 30 4906 10
          run_scenario goal-harness ux_queued_cancel 30 4908 8
          run_scenario goal-harness ux_search 30 4909 10
          run_scenario subagent-harness notify 45 4902 1
          run_scenario subagent-harness inspect 50 4903 2
          run_scenario subagent-harness drop 45 4905 3
          run_scenario subagent-harness ux_navigation 20 4907 5
          run_scenario subagent-harness bad_marker 45 4912 2
          run_scenario subagent-harness marker_text_escape 45 4913 3
          run_scenario subagent-harness spiral 75 4917 3
          run_scenario subagent-harness sync_child 60 4915 4
          run_scenario subagent-harness busy_parent 75 4916 3
          run_scenario goal-harness overflow_loop 90 4914 4
          run_scenario goal-harness desync_recovery 45 4918 6
          run_scenario goal-harness watchdog_remount 60 4919 7
          run_scenario goal-harness retry_park 60 4920 8

          exit "$fail"

      - name: Upload harness artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-logs
          path: |
            /tmp/harness-*.log
            /tmp/harness-*/snaps
            /tmp/harness-*/provider.log
            /tmp/harness-*/tui.log
          if-no-files-found: ignore
          retention-days: 7
